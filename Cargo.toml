[workspace]
resolver = "2"
members = [
    "crates/beamdrop-core",
    "crates/beamdrop-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
iroh = "0.35"
mdns-sd = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
anyhow = "1"
thiserror = "2"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
indicatif = "0.17"
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true


